# Nayla sync on a small VPS: Postgres, PostgREST, Caddy for TLS.
#
# Note what is NOT here: Postgres publishes no ports, so it is reachable only
# on the private compose network. Caddy is the only thing the internet can
# talk to, and it forwards just the two sync endpoints. PostgREST's table
# routes and OpenAPI surface are never exposed.

name: nayla

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nayla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?set AUTHENTICATOR_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nayla"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` — this is deliberate. Do not add one.

  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/nayla
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Nothing should be discovering this API; it has exactly two endpoints.
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_POOL: 10
      PGRST_SERVER_PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
